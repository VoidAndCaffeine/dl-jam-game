    <script>
        // Browsers block audio until the page has been interacted with: an
        // AudioContext created on load starts "suspended" and stays silent
        // until resume() is called inside a user gesture. Bevy's audio (via
        // cpal) creates exactly one AudioContext at startup and only ever
        // resumes it there, so without this every sound plays into a suspended
        // context and is never heard.
        //
        // Remember each AudioContext that gets created, then resume them all on
        // the first real interaction.
        (function () {
            var Ctx = window.AudioContext || window.webkitAudioContext;
            if (!Ctx) return;

            var contexts = [];
            function Patched() {
                var ctx = new Ctx(arguments.length ? arguments[0] : undefined);
                contexts.push(ctx);
                return ctx;
            }
            Patched.prototype = Ctx.prototype;
            Object.setPrototypeOf(Patched, Ctx);
            window.AudioContext = Patched;
            window.webkitAudioContext = Patched;

            function resumeAll() {
                for (var i = 0; i < contexts.length; i++) {
                    var ctx = contexts[i];
                    if (ctx && ctx.state === "suspended") {
                        var result = ctx.resume();
                        if (result && result.catch) result.catch(function () {});
                    }
                }
            }

            ["pointerdown", "mousedown", "touchstart", "touchend", "keydown", "click"].forEach(
                function (type) {
                    window.addEventListener(type, resumeAll, { passive: true });
                }
            );
        })();
    </script>

    <style>
        /* Center canvas and prevent scrollbars */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
        }
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
